name: Sync Resume from LaTeX Builder

# Fallback path for keeping the published resume current.
#
# The primary path is the other direction: latex-resume-builder builds the PDFs
# and pushes them straight here (see its .github/workflows/makefile.yml). That
# is immediate and should normally win. This workflow exists so the resume
# still catches up if that push is not configured or fails — and so it can be
# run on demand.
#
# Both paths write the same two files and are safe to run in either order: a
# sync that finds matching hashes exits without committing.

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Sync even if the PDFs are unchanged"
        required: false
        default: "false"

  repository_dispatch:
    types: [resume_updated]

  schedule:
    - cron: "0 9 * * 1"

concurrency:
  # Two overlapping syncs would race each other to push.
  group: sync-resume
  cancel-in-progress: false

env:
  BUILDER_RAW: https://raw.githubusercontent.com/f20180039/latex-resume-builder/main
  MULTI_COL_DEST: public/resume/Anshuman-Singh-Frontend-Engineer-Resume.pdf
  SINGLE_COL_DEST: public/resume/Anshuman-Singh-Frontend-Engineer-Resume-Single-Column.pdf
  META_FILE: src/common/resume-meta.json

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download resume PDFs
        id: fetch
        run: |
          set -euo pipefail

          # Downloads straight from the builder's default branch. An earlier
          # version looked for a GitHub release first, but that repo publishes
          # no releases, so the lookup 404'd on every run and always fell
          # through to this path.
          download() {
            local url="$1" dest="$2"
            echo "Downloading $url"
            curl -fsSL "$url" -o "$dest"

            if ! file "$dest" | grep -q "PDF"; then
              echo "::error::$url did not return a PDF"
              exit 1
            fi

            local size
            size=$(stat -c%s "$dest")
            if [ "$size" -lt 10000 ]; then
              echo "::error::$url returned only $size bytes; refusing to publish it"
              exit 1
            fi
            echo "  ok, $size bytes"
          }

          download "${BUILDER_RAW}/Anshuman_Singh_4FE.pdf"          /tmp/multi.pdf
          download "${BUILDER_RAW}/variants/resume-single-col.pdf"  /tmp/single.pdf

      - name: Compare against what the site currently serves
        id: diff
        run: |
          set -euo pipefail

          # Hashes are compared against the files the site actually serves.
          # A previous version compared against src/assets/, which no source
          # file imports — so it reported success while the published resume
          # never changed.
          changed=false
          for pair in "/tmp/multi.pdf:${MULTI_COL_DEST}" "/tmp/single.pdf:${SINGLE_COL_DEST}"; do
            new="${pair%%:*}"
            old="${pair##*:}"

            if [ ! -f "$old" ]; then
              echo "$old is missing — will create it"
              changed=true
              continue
            fi

            if [ "$(sha256sum "$new" | cut -d' ' -f1)" != "$(sha256sum "$old" | cut -d' ' -f1)" ]; then
              echo "$old differs from the builder's copy"
              changed=true
            else
              echo "$old is already up to date"
            fi
          done

          if [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            echo "force_sync requested"
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Back up the outgoing resume
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p public/resumes/backups

          if [ -f "${MULTI_COL_DEST}" ]; then
            cp "${MULTI_COL_DEST}" "public/resumes/backups/AnshumanSingh-FE-$(date -u +%Y-%m-%d-%H).pdf"
          fi

          # Keep the ten most recent.
          cd public/resumes/backups
          ls -t AnshumanSingh-FE-*.pdf 2>/dev/null | tail -n +11 | xargs -r rm -f

      - name: Install the new PDFs
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p public/resume
          cp /tmp/multi.pdf  "${MULTI_COL_DEST}"
          cp /tmp/single.pdf "${SINGLE_COL_DEST}"

          # Drives the month suffix on the downloaded filename, so a recruiter
          # can tell a stale copy from a current one.
          printf '{\n  "updatedAt": "%s"\n}\n' "$(date -u +%Y-%m-%d)" > "${META_FILE}"

      - name: Commit and push
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${MULTI_COL_DEST}" "${SINGLE_COL_DEST}" "${META_FILE}" public/resumes/backups/

          if git diff --staged --quiet; then
            echo "Nothing staged after all; leaving master alone."
            exit 0
          fi

          git commit -m "chore: sync resume from latex-resume-builder

          Updated: $(date -u +'%Y-%m-%d %H:%M UTC')
          Trigger: ${{ github.event_name }}"

          # Rebase before pushing, and retry. Checkout pins us to master as it
          # was when the run started; anything merged since then (a PR, another
          # workflow) leaves us behind and a plain push is rejected as
          # non-fast-forward. That is exactly how this failed before.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push rejected on attempt $attempt; rebasing onto origin/master."
            git pull --rebase origin master
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

  deploy:
    # A GITHUB_TOKEN push does not trigger `on: push`, so the site would keep
    # serving the previous resume until something else happened to deploy.
    # Calling the deploy workflow directly sidesteps that.
    needs: sync-resume
    if: needs.sync-resume.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: master
