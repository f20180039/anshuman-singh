name: Sync Resume from LaTeX Builder

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if unchanged'
        required: false
        default: 'false'

  repository_dispatch:
    types: [resume_updated]

  schedule:
    - cron: '0 9 * * 1'

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch latest resume from latex-resume-builder
        id: fetch-resume
        run: |
          echo "🔍 Fetching latest resume from latex-resume-builder..."

          LATEST_RELEASE=$(curl -s https://api.github.com/repos/f20180039/latex-resume-builder/releases/latest)

          RESUME_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[]? | select(.name == "Anshuman_Singh_4FE.pdf") | .browser_download_url' 2>/dev/null || true)

          if [ -z "$RESUME_URL" ] || [ "$RESUME_URL" = "null" ]; then
            echo "⚠️  No PDF found in latest release, checking for direct file access..."

            RESUME_URL="https://raw.githubusercontent.com/f20180039/latex-resume-builder/main/Anshuman_Singh_4FE.pdf"

            if ! curl -f -s -I "$RESUME_URL" > /dev/null; then
              echo "❌ PDF Anshuman_Singh_4FE.pdf not found in releases or main branch"
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "📥 Downloading from: $RESUME_URL"
          curl -L "$RESUME_URL" -o /tmp/new-resume.pdf

          if ! file /tmp/new-resume.pdf | grep -q "PDF"; then
            echo "❌ Downloaded file is not a valid PDF"
            exit 1
          fi

          FILE_SIZE=$(stat -f%z /tmp/new-resume.pdf 2>/dev/null || stat -c%s /tmp/new-resume.pdf)
          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "❌ Downloaded PDF is too small ($FILE_SIZE bytes)"
            exit 1
          fi

          echo "✅ Downloaded PDF ($FILE_SIZE bytes)"

          if [ -f "src/assets/AnshumanSingh-FE-Resume.pdf" ]; then
            NEW_HASH=$(sha256sum /tmp/new-resume.pdf | awk '{print $1}')
            OLD_HASH=$(sha256sum src/assets/AnshumanSingh-FE-Resume.pdf | awk '{print $1}')

            if [ "$NEW_HASH" = "$OLD_HASH" ] && [ "${{ github.event.inputs.force_sync }}" != "true" ]; then
              echo "ℹ️  Resume unchanged (hash: ${NEW_HASH:0:8}...)"
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "📝 Resume changed"
            echo "   Old hash: ${OLD_HASH:0:16}..."
            echo "   New hash: ${NEW_HASH:0:16}..."
          else
            echo "📝 First time sync - no existing resume"
          fi

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create backup directory
        if: steps.fetch-resume.outputs.changed == 'true'
        run: mkdir -p public/resumes/backups

      - name: Create timestamped backup
        if: steps.fetch-resume.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H")
          BACKUP_NAME="AnshumanSingh-FE-${TIMESTAMP}.pdf"

          echo "💾 Creating backup: $BACKUP_NAME"

          if [ -f "src/assets/AnshumanSingh-FE-Resume.pdf" ]; then
            cp src/assets/AnshumanSingh-FE-Resume.pdf "public/resumes/backups/${BACKUP_NAME}"
            echo "✅ Backup created successfully"
          else
            echo "ℹ️  No existing resume to backup"
          fi

      - name: Update main resume
        if: steps.fetch-resume.outputs.changed == 'true'
        run: |
          echo "🔄 Updating main resume..."
          cp /tmp/new-resume.pdf src/assets/AnshumanSingh-FE-Resume.pdf
          echo "✅ Main resume updated"

      - name: Cleanup old backups (keep last 10)
        if: steps.fetch-resume.outputs.changed == 'true'
        run: |
          cd public/resumes/backups

          BACKUP_COUNT=$(ls -1 AnshumanSingh-FE-*.pdf 2>/dev/null | wc -l)
          echo "📊 Current backup count: $BACKUP_COUNT"

          if [ "$BACKUP_COUNT" -gt 10 ]; then
            ls -t AnshumanSingh-FE-*.pdf | tail -n +11 | xargs rm -f
            REMAINING=$(ls -1 AnshumanSingh-FE-*.pdf 2>/dev/null | wc -l)
            echo "🗑️  Cleaned up old backups. Remaining: $REMAINING"
          else
            echo "✅ No cleanup needed (under limit)"
          fi

      - name: Commit and push changes
        if: steps.fetch-resume.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/assets/AnshumanSingh-FE-Resume.pdf public/resumes/backups/

          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_MSG="chore: sync resume from latex-resume-builder"$'\n\n'"Updated: ${TIMESTAMP}"$'\n'"Trigger: ${{ github.event_name }}"
          git commit -m "$COMMIT_MSG"

          git push

          echo "✅ Changes committed and pushed successfully"
          echo "📦 Deploy workflow will automatically trigger to rebuild the site"

      - name: Summary
        if: always()
        run: |
          echo "## Resume Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.fetch-resume.outputs.changed }}" = "true" ]; then
            echo "✅ **Status:** Resume synced successfully" >> $GITHUB_STEP_SUMMARY
            echo "📅 **Timestamp:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
            echo "🔄 **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️  **Status:** No changes detected" >> $GITHUB_STEP_SUMMARY
            echo "📅 **Checked:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          fi
