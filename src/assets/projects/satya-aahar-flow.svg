<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-labelledby="t d">
  <title id="t">Satya Aahar pipeline</title>
  <desc id="d">A label photo goes through barcode and vision extraction, then the rules engine with the ICMR-NIN 2024 India pack, which produces HIGH SUGAR / SALT / FAT warnings in English and Hindi and per-family-member flags.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#6b7a8a"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Noto Sans Devanagari", "Kohinoor Devanagari", sans-serif; fill: #1b2430; }
    .lbl { font-size: 13px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #5b6774; }
    .step { font-size: 9.5px; fill: #8a96a3; font-weight: 700; letter-spacing: .08em; }
    .box { fill: #ffffff; stroke: #c9d2dc; stroke-width: 1.25; }
    .box.engine { fill: #e3f4f2; stroke: #0b6e6a; }
    .box.warn { fill: #fdecea; stroke: #b42318; }
    .edge { stroke: #6b7a8a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ico { fill: none; stroke: #0b6e6a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- 1. Label photo -->
  <text class="step" x="20" y="36">01</text>
  <rect class="box" x="20" y="44" width="108" height="78" rx="12"/>
  <g class="ico" transform="translate(32,56)">
    <rect x="0" y="4" width="22" height="16" rx="3"/>
    <circle cx="11" cy="12" r="4.5"/>
    <path d="M7 4 L9 0 L13 0 L15 4"/>
  </g>
  <text class="lbl" x="32" y="96">Label photo</text>
  <text class="sub" x="32" y="112">Packaged-food pack</text>

  <!-- 2. Extraction -->
  <text class="step" x="140" y="36">02</text>
  <rect class="box" x="140" y="44" width="124" height="78" rx="12"/>
  <g class="ico" transform="translate(152,56)">
    <path d="M0 0 V18 M4 0 V18 M8 0 V18 M13 0 V18 M17 0 V18 M21 0 V18"/>
  </g>
  <text class="lbl" x="152" y="96">Barcode + vision</text>
  <text class="sub" x="152" y="112">zxing-cpp · label read</text>

  <!-- 3. Rules engine -->
  <text class="step" x="276" y="36">03</text>
  <rect class="box engine" x="276" y="44" width="140" height="78" rx="12"/>
  <g class="ico" transform="translate(288,55)">
    <rect x="0" y="0" width="22" height="20" rx="3"/>
    <path d="M5 6 H17 M5 10 H17 M5 14 H12"/>
  </g>
  <text class="lbl" x="288" y="96">Rules engine</text>
  <text class="sub" x="288" y="112">ICMR-NIN 2024 India pack</text>

  <!-- 4. Warnings -->
  <text class="step" x="428" y="36">04</text>
  <rect class="box warn" x="428" y="44" width="192" height="78" rx="12"/>
  <g class="ico" transform="translate(440,55)" style="stroke:#b42318">
    <path d="M11 1 L21 19 H1 Z"/>
    <path d="M11 8 V13 M11 16 V16.5"/>
  </g>
  <text class="lbl" x="440" y="96" style="font-size:12.5px">HIGH SUGAR / SALT / FAT</text>
  <text class="sub" x="440" y="112">Warnings · English · हिंदी</text>

  <!-- 5. Family flags (below the engine, fed by the warnings) -->
  <text class="step" x="276" y="152">05</text>
  <rect class="box" x="276" y="160" width="344" height="52" rx="12"/>
  <g class="ico" transform="translate(288,172)">
    <circle cx="6" cy="6" r="4"/>
    <circle cx="19" cy="7" r="3"/>
    <path d="M0 20 C0 13 12 13 12 20 M14 20 C14 15 24 15 24 20"/>
  </g>
  <text class="lbl" x="324" y="181">Family flags</text>
  <text class="sub" x="324" y="197">Per member: child, diabetes, hypertension, allergens, diet</text>

  <!-- edges -->
  <path class="edge" d="M128 83 H138"/>
  <path class="edge" d="M264 83 H274"/>
  <path class="edge" d="M416 83 H426"/>
  <path class="edge" d="M524 122 V140 Q524 150 514 150 H358 Q348 150 348 158"/>
</svg>
